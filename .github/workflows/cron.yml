name: forex-signal-cron

on:
  schedule:
    # สแกนหา signal ใหม่ทุกชั่วโมง — เข้ากับกลยุทธ์ TF 1H
    - cron: "5 * * * *"
    # เช็คผล TP/SL ทุก 15 นาที
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # กดรันมือได้จากแท็บ Actions

jobs:
  scan:
    if: github.event.schedule == '5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: เรียก /api/scan (หา signal ใหม่)
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/scan" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  monitor:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: เรียก /api/monitor (เช็ค TP/SL ของสัญญาณเปิด)
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/monitor" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
