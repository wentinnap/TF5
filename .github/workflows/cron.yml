name: forex-signal-cron

on:
  schedule:
    # สแกนหา signal ใหม่วันละครั้ง — เข้ากับกลยุทธ์ TF ยาว (daily) ไม่ต้องสแกนถี่
    # 22:00 UTC ≈ หลังตลาด New York session เพิ่งปิด/แท่งรายวันเพิ่งจบ (ปรับเวลาได้ตามต้องการ)
    - cron: "0 22 * * *"
    # เช็คผล TP/SL ทุก 30 นาที (ราคาชน SL/TP ได้ตลอดเวลาแม้ entry จะมาจาก TF ยาว)
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # กดรันมือได้จากแท็บ Actions

jobs:
  scan:
    if: github.event.schedule == '0 22 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: เรียก /api/scan (หา signal ใหม่)
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/scan" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  monitor:
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: เรียก /api/monitor (เช็ค TP/SL ของสัญญาณเปิด)
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/monitor" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
