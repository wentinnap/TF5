name: forex-signal-sweep

# ทดสอบหลายชุดพารามิเตอร์อัตโนมัติ แล้วบอกว่าชุดไหนดีที่สุดจริงจากข้อมูล
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "คู่เงินที่จะทดสอบ เช่น EUR/USD, XAU/USD"
        required: true
        default: "EUR/USD"
      interval:
        description: "Time frame ต้องพิมพ์เต็มรูปแบบ: 15min, 1h, 4h, 1day"
        required: true
        default: "1h"
      outputsize:
        description: "จำนวนแท่งย้อนหลัง (แนะนำ >= 2000 เพื่อให้มีไม้พอทดสอบ)"
        required: true
        default: "2000"

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ติดตั้ง dependencies
        run: npm install --ignore-scripts

      - name: รัน parameter sweep (อาจใช้เวลา 1-3 นาที)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          npm run sweep -- "${{ github.event.inputs.symbol }}" "${{ github.event.inputs.interval }}" "${{ github.event.inputs.outputsize }}" > sweep-output.txt 2>&1 || true
          cat sweep-output.txt

      - name: แสดงผลใน Summary
        if: always()
        run: |
          echo "## ผล Parameter Sweep: ${{ github.event.inputs.symbol }} (TF ${{ github.event.inputs.interval }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat sweep-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
